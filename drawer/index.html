<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>fm_drawer</title>
<style>
  :root { --bg: #f6f7f9; --fg: #1f2328; --btn: #ffffff; --bd: #d0d7de; --acc: #ff3b30; }
  html, body { margin: 0; padding: 0; background: transparent; font-family: "Source Sans Pro", system-ui, sans-serif; color: var(--fg); }
  #bar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 4px 0 6px; font-size: 13px; }
  #bar button { border: 1px solid var(--bd); background: var(--btn); border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 13px; }
  #bar button.on { background: var(--acc); color: #fff; border-color: var(--acc); }
  #bar button.sub.on { background: #0a66ff; border-color: #0a66ff; }
  #bar .sep { width: 1px; height: 20px; background: var(--bd); margin: 0 4px; }
  #bar label { display: flex; align-items: center; gap: 4px; }
  #bar input[type=range] { width: 90px; }
  #hint { color: #57606a; font-size: 12px; margin-left: auto; }
  #wrap { position: relative; width: 100%; background: #111; border-radius: 6px; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
// --- protocolo mínimo de componentes de Streamlit ---
function send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*"); }
const Streamlit = {
  ready: () => send("streamlit:componentReady", { apiVersion: 1 }),
  height: (h) => send("streamlit:setFrameHeight", { height: h }),
  value: (v) => send("streamlit:setComponentValue", { value: v, dataType: "json" }),
};

const TOOLS = {
  lazo: ["✏️ Lazo", "Arrastra para rodear la zona"],
  poligono: ["⬠ Polígono", "Clic en cada vértice; doble clic o clic en el primero para cerrar"],
  pincel: ["🖌️ Pincel", "Pinta encima de la zona"],
  borrador: ["🧽 Borrador", "Borra lo pintado"],
  rect: ["▭ Rectángulo", "Arrastra para dibujar un rectángulo"],
  punto: ["• Punto", "Clic en cada punto"],
  mano: ["✋ Mover", "Arrastra para desplazar la vista"],
};

const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), wrap = document.getElementById("wrap"), bar = document.getElementById("bar");
let img = new Image(), ovl = null, imgSrc = null, ovlSrc = null;
let args = {}, shapes = [], cur = null, tool = "lazo", subtract = false, brush = 8, version = 0, inited = false, resetToken = null;
let view = { z: 1, x: 0, y: 0 };  // z: píxeles de pantalla por píxel de imagen; x, y: esquina superior izquierda en coords. de imagen
let srcScale = 1;  // píxeles de la imagen original por píxel de la imagen mostrada
let panning = null, spaceDown = false, hover = null;

function buildBar() {
  bar.innerHTML = "";
  (args.tools || Object.keys(TOOLS)).concat(["mano"]).forEach((t) => {
    if (!TOOLS[t] || bar.querySelector(`[data-t=${t}]`)) return;
    const b = document.createElement("button");
    b.textContent = TOOLS[t][0]; b.dataset.t = t; b.title = TOOLS[t][1];
    b.onclick = () => { tool = t; cur = null; refreshBar(); draw(); };
    bar.appendChild(b);
  });
  if (args.allow_subtract !== false) {
    const s = document.createElement("button");
    s.textContent = "➖ Restar"; s.className = "sub"; s.id = "subbtn"; s.title = "Lo que dibujes se quita de la zona";
    s.onclick = () => { subtract = !subtract; refreshBar(); };
    bar.appendChild(s);
  }
  const lab = document.createElement("label");
  lab.innerHTML = `Pincel <input id="bs" type="range" min="1" max="80" value="${brush}"><span id="bsv">${brush}px</span>`;
  bar.appendChild(lab);
  lab.querySelector("#bs").oninput = (e) => { brush = +e.target.value; lab.querySelector("#bsv").textContent = brush + "px"; };
  bar.appendChild(Object.assign(document.createElement("div"), { className: "sep" }));
  const mk = (txt, title, fn) => { const b = document.createElement("button"); b.textContent = txt; b.title = title; b.onclick = fn; bar.appendChild(b); };
  mk("↶ Deshacer", "Quita lo último dibujado", () => { shapes.pop(); cur = null; commit(); });
  mk("🗑 Borrar", "Borra todo lo dibujado", () => { shapes = []; cur = null; commit(); });
  mk("⤢ Ajustar", "Ver la imagen completa", () => { fit(); draw(); });
  mk("🔍 1:1", "Zoom a píxel real de la cámara", () => { zoomAt(cv.width / 2, cv.height / 2, (window.devicePixelRatio || 1) * srcScale / view.z); });
  const h = document.createElement("span"); h.id = "hint"; bar.appendChild(h);
  refreshBar();
}
function refreshBar() {
  bar.querySelectorAll("button[data-t]").forEach((b) => b.classList.toggle("on", b.dataset.t === tool));
  const s = document.getElementById("subbtn"); if (s) s.classList.toggle("on", subtract);
  const h = document.getElementById("hint");
  if (h) h.textContent = (TOOLS[tool] ? TOOLS[tool][1] : "") + " · rueda: zoom · espacio/botón derecho: mover · " + Math.round(view.z / ((window.devicePixelRatio || 1) * srcScale) * 100) + "%";
}

function sizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth || 600;
  const maxH = args.max_height || 700;
  let h = img.naturalWidth ? Math.round(w * img.naturalHeight / img.naturalWidth) : 400;
  h = Math.min(h, maxH);
  cv.style.height = h + "px";
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  Streamlit.height(bar.offsetHeight + h + 8);
}
function fit() {
  if (!img.naturalWidth) return;
  const z = Math.min(cv.width / img.naturalWidth, cv.height / img.naturalHeight);
  view.z = z;
  view.x = -(cv.width / z - img.naturalWidth) / 2;
  view.y = -(cv.height / z - img.naturalHeight) / 2;
  refreshBar();
}
function zoomAt(px, py, factor) {
  const ix = view.x + px / view.z, iy = view.y + py / view.z;
  view.z = Math.max(0.05, Math.min(64, view.z * factor));
  view.x = ix - px / view.z; view.y = iy - py / view.z;
  refreshBar(); draw();
}
// pantalla (px del canvas) <-> imagen mostrada <-> imagen original
const toImg = (px, py) => [view.x + px / view.z, view.y + py / view.z];
const toScr = (ix, iy) => [(ix - view.x) * view.z, (iy - view.y) * view.z];
const toSrc = ([ix, iy]) => [ix * srcScale, iy * srcScale];
const fromSrc = ([sx, sy]) => [sx / srcScale, sy / srcScale];

function pathOf(pts, close) {
  ctx.beginPath();
  pts.forEach((p, i) => { const [x, y] = toScr(...fromSrc(p)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  if (close) ctx.closePath();
}
function drawShape(s, live) {
  const add = s.op !== "sub";
  const stroke = add ? "rgba(255,59,48,0.95)" : "rgba(10,102,255,0.95)";
  const fill = args.fill_shapes === false && !live && s.t !== "stroke" ? "rgba(0,0,0,0)" : (add ? "rgba(255,59,48,0.28)" : "rgba(10,102,255,0.28)");
  ctx.lineWidth = Math.max(1.5, (window.devicePixelRatio || 1) * 1.5);
  ctx.strokeStyle = stroke; ctx.fillStyle = fill; ctx.lineJoin = "round"; ctx.lineCap = "round";
  if (s.t === "poly" && s.pts.length) {
    pathOf(s.pts, !live); if (!live || s.pts.length > 2) ctx.fill(); ctx.stroke();
    if (live && s.kind === "poligono") s.pts.forEach((p) => { const [x, y] = toScr(...fromSrc(p)); ctx.fillStyle = stroke; ctx.fillRect(x - 3, y - 3, 6, 6); });
  } else if (s.t === "rect") {
    const [x0, y0] = toScr(...fromSrc([s.x, s.y])), [x1, y1] = toScr(...fromSrc([s.x + s.w, s.y + s.h]));
    ctx.fillRect(x0, y0, x1 - x0, y1 - y0); ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
  } else if (s.t === "stroke" && s.pts.length) {
    ctx.strokeStyle = fill.replace("0.28", "0.45"); ctx.lineWidth = Math.max(1, 2 * s.r / srcScale * view.z);
    pathOf(s.pts.length === 1 ? [s.pts[0], s.pts[0]] : s.pts, false); ctx.stroke();
  } else if (s.t === "point") {
    const [x, y] = toScr(...fromSrc([s.x, s.y]));
    ctx.beginPath(); ctx.arc(x, y, 6, 0, 2 * Math.PI); ctx.fillStyle = stroke; ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
  }
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#111"; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!img.naturalWidth) return;
  ctx.imageSmoothingEnabled = view.z < 2;
  const [x, y] = toScr(0, 0);
  ctx.drawImage(img, x, y, img.naturalWidth * view.z, img.naturalHeight * view.z);
  if (ovl && ovl.naturalWidth) {
    ctx.globalAlpha = args.overlay_alpha || 0.9;
    ctx.drawImage(ovl, x, y, img.naturalWidth * view.z, img.naturalHeight * view.z);
    ctx.globalAlpha = 1;
  }
  shapes.forEach((s) => drawShape(s, false));
  if (cur) drawShape(cur, true);
  if (hover && (tool === "pincel" || tool === "borrador")) {  // cursor del pincel
    ctx.beginPath(); ctx.arc(hover[0], hover[1], Math.max(1, brush / srcScale * view.z), 0, 2 * Math.PI);
    ctx.strokeStyle = tool === "borrador" ? "#0a66ff" : "#ff3b30"; ctx.lineWidth = 1; ctx.stroke();
  }
}
function commit() {
  version += 1;
  Streamlit.value({ shapes, v: version });
  draw();
}
function evPos(e) {
  const r = cv.getBoundingClientRect(), dpr = cv.width / r.width;
  return [(e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr];
}
cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("wheel", (e) => { e.preventDefault(); const [px, py] = evPos(e); zoomAt(px, py, e.deltaY < 0 ? 1.25 : 0.8); }, { passive: false });
window.addEventListener("keydown", (e) => {
  if (e.code === "Space") { spaceDown = true; e.preventDefault(); }
  if (e.key === "Escape") { cur = null; draw(); }
  if ((e.ctrlKey || e.metaKey) && e.key === "z") { shapes.pop(); commit(); }
});
window.addEventListener("keyup", (e) => { if (e.code === "Space") spaceDown = false; });

cv.addEventListener("pointerdown", (e) => {
  cv.setPointerCapture(e.pointerId);
  const [px, py] = evPos(e);
  if (e.button === 1 || e.button === 2 || spaceDown || tool === "mano") { panning = [px, py, view.x, view.y]; return; }
  const p = toSrc(toImg(px, py));
  const op = subtract ? "sub" : "add";
  if (tool === "lazo") cur = { t: "poly", kind: "lazo", pts: [p], op };
  else if (tool === "rect") cur = { t: "rect", x: p[0], y: p[1], w: 0, h: 0, x0: p[0], y0: p[1], op };
  else if (tool === "pincel" || tool === "borrador") cur = { t: "stroke", pts: [p], r: brush, op: tool === "borrador" ? "sub" : "add" };
  else if (tool === "punto") { shapes.push({ t: "point", x: p[0], y: p[1], op: "add" }); commit(); }
  else if (tool === "poligono") {
    if (!cur) cur = { t: "poly", kind: "poligono", pts: [p], op };
    else {
      const [fx, fy] = toScr(...fromSrc(cur.pts[0]));
      if (cur.pts.length > 2 && Math.hypot(fx - px, fy - py) < 12) { shapes.push(cur); cur = null; commit(); return; }
      cur.pts.push(p);
    }
  }
  draw();
});
cv.addEventListener("pointermove", (e) => {
  const [px, py] = evPos(e);
  hover = [px, py];
  if (panning) { view.x = panning[2] - (px - panning[0]) / view.z; view.y = panning[3] - (py - panning[1]) / view.z; draw(); return; }
  if (!cur || !(e.buttons & 1)) { draw(); return; }
  const p = toSrc(toImg(px, py));
  if (cur.t === "poly" && cur.kind === "lazo") cur.pts.push(p);
  else if (cur.t === "stroke") cur.pts.push(p);
  else if (cur.t === "rect") { cur.x = Math.min(cur.x0, p[0]); cur.y = Math.min(cur.y0, p[1]); cur.w = Math.abs(p[0] - cur.x0); cur.h = Math.abs(p[1] - cur.y0); }
  draw();
});
cv.addEventListener("pointerup", () => {
  if (panning) { panning = null; return; }
  if (!cur) return;
  if (cur.t === "poly" && cur.kind === "lazo") { if (cur.pts.length > 2) shapes.push(cur); cur = null; commit(); }
  else if (cur.t === "stroke") { shapes.push(cur); cur = null; commit(); }
  else if (cur.t === "rect") { if (cur.w > 1 && cur.h > 1) { delete cur.x0; delete cur.y0; shapes.push(cur); } cur = null; commit(); }
});
cv.addEventListener("dblclick", () => {
  if (cur && cur.kind === "poligono" && cur.pts.length > 2) { shapes.push(cur); cur = null; commit(); }
});
cv.addEventListener("pointerleave", () => { hover = null; draw(); });

window.addEventListener("message", (event) => {
  if (event.data.type !== "streamlit:render") return;
  args = event.data.args || {};
  const first = !inited;
  if (first || args.reset_token !== resetToken) {
    shapes = Array.isArray(args.shapes) ? args.shapes : [];
    resetToken = args.reset_token; cur = null;
  }
  if (first) { tool = args.default_tool || (args.tools && args.tools[0]) || "lazo"; brush = args.brush || brush; }
  inited = true;
  srcScale = args.src_scale || 1;
  buildBar();
  if (args.image !== imgSrc) {
    imgSrc = args.image;
    img = new Image();
    img.onload = () => { sizeCanvas(); fit(); draw(); };
    img.src = imgSrc;
  } else { sizeCanvas(); draw(); }
  if (args.overlay !== ovlSrc) {
    ovlSrc = args.overlay;
    if (ovlSrc) { ovl = new Image(); ovl.onload = draw; ovl.src = ovlSrc; } else { ovl = null; draw(); }
  }
});
window.addEventListener("resize", () => { sizeCanvas(); fit(); draw(); });
Streamlit.ready();
</script>
</body>
</html>
