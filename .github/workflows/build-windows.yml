name: Compilar .exe para Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements-build.txt
      - name: Tests
        run: python -m pytest -q
      - name: Compilar ejecutable
        run: >
          pyinstaller --noconfirm --onefile --windowed --name DibujadorPerfiles
          --add-data "ejemplos;ejemplos" --add-data "perfil_app/fuentes;fuentes" app.py
      - name: Preparar paquete
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force paquete | Out-Null
          Copy-Item dist/DibujadorPerfiles.exe paquete/
          Copy-Item -Recurse ejemplos paquete/
          Copy-Item README.md paquete/
      - uses: actions/upload-artifact@v4
        with:
          name: DibujadorPerfiles-windows
          path: paquete/
