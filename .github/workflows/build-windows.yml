name: Construir InspectorIA.exe (Windows)

on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "main"]
    paths: ["inspector_ia/**", "InspectorIA.py", "InspectorIA.spec", "requirements.txt", ".github/workflows/build-windows.yml"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias (PyTorch CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest httpx pyinstaller

      - name: Tests
        run: python -m pytest -q tests

      - name: Incluir pesos preentrenados (ImageNet) dentro del ejecutable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pesos | Out-Null
          Invoke-WebRequest https://download.pytorch.org/models/resnet18-f37072fd.pth -OutFile pesos/resnet18.pth
          python -c "import torch, torchvision; m = torchvision.models.resnet18(); m.load_state_dict(torch.load('pesos/resnet18.pth', weights_only=True)); print('pesos OK')"

      - name: Construir ejecutable
        run: pyinstaller --noconfirm InspectorIA.spec

      - name: Prueba de arranque del .exe
        shell: pwsh
        run: |
          $env:INSPECTOR_IA_DATOS = "$env:RUNNER_TEMP\datos_prueba"
          $p = Start-Process -FilePath dist\InspectorIA\InspectorIA.exe -ArgumentList "--sin-navegador","--puerto","8799" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod http://127.0.0.1:8799/api/estado; $ok = $true; break } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "El ejecutable no arrancó" }
          if (-not $r.preentrenado) { throw "Faltan los pesos preentrenados en el ejecutable" }
          Write-Host "Arranca OK, version $($r.version), preentrenado=$($r.preentrenado)"

      - name: Empaquetar
        shell: pwsh
        run: Compress-Archive -Path dist\InspectorIA -DestinationPath InspectorIA-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: InspectorIA-windows
          path: InspectorIA-windows.zip
          retention-days: 30
