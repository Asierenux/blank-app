# Relevo del SAIH Ebro para la app del iPhone.
#
# El iPhone no acepta el certificado de www.saihebro.com. Cada 20 minutos, GitHub lee las
# fichas del SAIH en sus servidores (comprobando el certificado hasta una raíz de confianza)
# y publica los datos en la rama "datos-saih", que el iPhone lee en
# https://raw.githubusercontent.com/Asierenux/blank-app/datos-saih/saih.json
#
# Ojo: GitHub solo ejecuta lo programado ("schedule") desde la rama principal (main).
name: Relevo SAIH

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
  push:
    paths: ["monitor-vitoria/monitor_vitoria/relevo_saih.py", ".github/workflows/relevo-saih.yml"]

permissions:
  contents: write

concurrency:
  group: relevo-saih
  cancel-in-progress: false

jobs:
  relevo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitor-vitoria/requirements.txt

      - name: Instalar dependencias
        run: pip install -r monitor-vitoria/requirements.txt

      - name: Datos anteriores (para conservar 7 días)
        run: |
          git fetch --depth=1 origin datos-saih && git show origin/datos-saih:saih.json > anterior.json || echo '{}' > anterior.json

      - name: Diagnóstico de conexión con el SAIH
        continue-on-error: true
        run: |
          echo "IP y país de este servidor:"; curl -s -m 10 https://ipinfo.io/json | grep -E '"(ip|city|country|org)"' || true
          echo "DNS:"; getent hosts www.saihebro.com saihebro.com || true
          for u in https://www.saihebro.com/ http://www.saihebro.com/ https://saihebro.com/; do
            echo "== $u"; curl -s -o /dev/null -m 20 -w "código %{http_code} · tiempo %{time_total}s · ip %{remote_ip}\n" "$u" || echo "sin respuesta (curl $?)"
          done
          echo "== certificado"; timeout 20 openssl s_client -connect www.saihebro.com:443 -servername www.saihebro.com -showcerts </dev/null 2>&1 | grep -E "s:|i:|Verify return code" || true

      - name: Leer el SAIH
        working-directory: monitor-vitoria
        run: python -m monitor_vitoria.relevo_saih ../anterior.json ../saih.json

      - name: Publicar en la rama datos-saih
        run: |
          mkdir publicar && cp saih.json publicar/ && cd publicar
          git init -q -b datos-saih
          git config user.name "relevo-saih"
          git config user.email "relevo-saih@users.noreply.github.com"
          git add saih.json && git commit -q -m "Datos del SAIH $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos-saih
          echo "Publicado: https://raw.githubusercontent.com/${{ github.repository }}/datos-saih/saih.json" >> "$GITHUB_STEP_SUMMARY"
